server {
    listen 80;
    server_name www.pztxwx.cn;
    root /www/wwwroot/www.pztxwx.cn;

    include /www/server/panel/vhost/nginx/well-known/www.pztxwx.cn.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/www.pztxwx.cn;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }

    access_log /www/wwwlogs/www.pztxwx.cn.log;
    error_log /www/wwwlogs/www.pztxwx.cn.error.log;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.pztxwx.cn;
    root /www/wwwroot/www.pztxwx.cn;

    ssl_certificate /www/server/panel/vhost/letsencrypt/www.pztxwx.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/letsencrypt/www.pztxwx.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/www.pztxwx.cn;
        allow all;
    }

    location = /api/v1/health {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-User "";
        proxy_set_header X-Role "";
        proxy_set_header X-Requested-Role "";
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }

    access_log /www/wwwlogs/www.pztxwx.cn.log;
    error_log /www/wwwlogs/www.pztxwx.cn.error.log;
}
