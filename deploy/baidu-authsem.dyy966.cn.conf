server
{
    listen 80;
    listen 443 ssl;
    listen 443 quic;
    http2 on;
    server_name baidu-authsem.dyy966.cn;
    root /www/wwwroot/baidu-authsem.dyy966.cn;

    include /www/server/panel/vhost/nginx/well-known/baidu-authsem.dyy966.cn.conf;

    ssl_certificate /www/server/panel/vhost/cert/baidu-authsem.dyy966.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/baidu-authsem.dyy966.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers EECDH+CHACHA20:EECDH+AES128:RSA+AES128:EECDH+AES256:RSA+AES256:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_tickets on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    error_page 497 https://$host$request_uri;

    location ^~ /.well-known/ {
        root /www/wwwroot/baidu-authsem.dyy966.cn;
        allow all;
    }

    location = /api/v1/health {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/baidu/oauth/callback {
        # Local development OAuth states are created in the developer's local
        # PostgreSQL. Send only those browser callbacks back to that machine;
        # cloud/e-commerce states continue to use the public authorization center.
        if ($arg_state ~ "^search-local\.") {
            return 302 http://127.0.0.1:8280/api/baidu/oauth/callback$is_args$args;
        }
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
    }

    location ^~ / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-User "";
        proxy_set_header X-Role "";
        proxy_set_header X-Requested-Role "";
        proxy_read_timeout 120s;
        client_max_body_size 20m;
    }

    access_log /www/wwwlogs/baidu-authsem.dyy966.cn.log;
    error_log /www/wwwlogs/baidu-authsem.dyy966.cn.error.log;
}
