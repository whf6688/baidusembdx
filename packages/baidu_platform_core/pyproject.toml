[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baidu-platform-core"
version = "0.1.0"
description = "Shared Baidu application runtime for ecommerce and search projects"
requires-python = ">=3.11"
dependencies = ["cryptography>=43,<46", "httpx>=0.27,<1", "sqlalchemy>=2,<3", "psycopg[binary]>=3.2,<4"]

[tool.hatch.build.targets.wheel]
packages = ["src/baidu_platform_core"]
