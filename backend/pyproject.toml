[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baidu-search-console"
version = "0.1.0"
description = "Baidu search advertising operations console"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "celery[redis]>=5.4,<6",
  "duckdb>=1.1,<2",
  "python-multipart>=0.0.12,<1",
  "openpyxl>=3.1,<4",
  "httpx>=0.27,<1",
  "cryptography>=43,<46",
  "passlib>=1.7.4,<2",
  "bcrypt>=4.1,<5",
  "playwright>=1.49,<2",
  "baidu-platform-core",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7", "ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/search_console"]

[tool.uv.sources]
baidu-platform-core = { path = "../packages/baidu_platform_core", editable = true }

[tool.pytest.ini_options]
pythonpath = ["src", "../packages/baidu_platform_core/src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
